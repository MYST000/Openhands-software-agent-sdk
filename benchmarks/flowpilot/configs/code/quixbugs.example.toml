# OpenHands multi-turn development profile; not an upstream single-generation leaderboard run.
[dataset]
kind = "quixbugs"
id = "jkoppel/QuixBugs"
path = "./assets/quixbugs"
revision = "4257f44b0ff1181dedaedee6a447e133219fcebf"
split = "dev"
setting = "openhands-python-code-v1"

[llm]
model = "openai/qwen3.5-9b"
base_url = "http://127.0.0.1:8000/v1"
api_key_env = "LLM_API_KEY"
temperature = 0.0
max_output_tokens = 16384
timeout = 600
num_retries = 0
native_tool_calling = true

[runtime]
max_iterations = 24
max_tool_calls = 36
max_llm_requests = 28
task_timeout = 900
tool_timeout = 30
runs_dir = "./runs"
