# Pinned data and SDK; edit model endpoint and Docker settings for your server.
[dataset]
kind = "swe"
id = "princeton-nlp/SWE-bench_Verified"
revision = "c104f840cc67f8b6eec6f759ebc8b2693d585d4a"
split = "test"
path = "/root/predictor_exp/data/swe_bench/SWE-bench_Verified/data/test-00000-of-00001.parquet"
sha256 = "a45b1fe4e2f0c8390b2b2938ac83e92ed5979000856808f3679c07812e9e6dcd"
setting = "openhands-code-v1"

[llm]
model = "openai/qwen3.5-9b"
base_url = "http://127.0.0.1:8000/v1"
api_key_env = "LLM_API_KEY"
temperature = 0.0
max_output_tokens = 4096
timeout = 180
num_retries = 2
native_tool_calling = true

[runtime]
sdk_path = "/root/predictor_exp/repos/Openhands-software-agent-sdk"
sdk_commit = "a6db5dcba26a3acfaeac58c8ba5195433a0e223d"
runs_dir = "/root/predictor_exp/runs/benchmark_adapters"
max_iterations = 60
max_tool_calls = 120
max_llm_requests = 80
task_timeout = 3600
tool_timeout = 120
max_output_chars = 16000

[docker]
image_template = "swebench/sweb.eval.x86_64.{image_id}:latest"
repo_dir = "/testbed"
conda_env = "testbed"
network_disabled = true
memory_limit = "8g"
nano_cpus = 2000000000
pids_limit = 512
pull_missing = false
keep_container = false

[evaluation]
python = "/root/predictor_exp/benchmark_adapters/.venv-eval/bin/python"
harness_path = "/root/predictor_exp/repos/SWE-bench"
workers = 1
timeout = 1800
namespace = "swebench"
image_tag = "latest"
