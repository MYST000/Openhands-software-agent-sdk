[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flowpilot-benchmark-adapters"
version = "0.2.0"
description = "Benchmark collection extension maintained inside the MYST000 OpenHands SDK repository"
requires-python = ">=3.12"
dependencies = ["pyarrow>=16", "docker>=7,<8", "ujson>=5,<6"]

[project.scripts]
benchmark-adapters = "benchmark_adapters.cli:main"
openhands-code-collect = "benchmark_adapters.code_collection:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.setuptools.package-data]
benchmark_adapters = ["data/*.json"]
